[package]
name = "ostfil"
version = "1.0.4"
edition = "2021"

# 核心：指定编译为 动态库 + C ABI 兼容
[lib]
crate-type = ["cdylib", "rlib"]  # cdylib 供宿主加载；rlib 供 tests/ 集成测试链接
name = "ostfil"        # 输出库名：librust_lib.so / rust_lib.dll

[dependencies]
chrono = "0.4.45"
flate2 = "1.1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23.2", features = ["v4"] }
sha2 = "0.10"
