name: Release (dytes)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  DYTES_VERSION: "0.2.1"

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.meta.outputs.platforms }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./dytes.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 dytes.json 版本 ${version} 不一致" >&2
            exit 1
          fi
          cargo_version=$(node -e "const fs=require('fs');const m=fs.readFileSync('Cargo.toml','utf8').match(/^version\\s*=\\s*\"([^\"]+)\"/m);process.stdout.write(m?m[1]:'')")
          if [ "${cargo_version}" != "${version}" ]; then
            echo "Cargo.toml 版本 ${cargo_version} 与 dytes.json 版本 ${version} 不一致" >&2
            exit 1
          fi
          platforms=$(node -e "const d=require('./dytes.json');const p=Object.keys(d['platform-exports']||{});process.stdout.write(JSON.stringify(p.length?p:['windows']))")
          echo "platforms=${platforms}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: ${{ fromJson(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.platform == 'windows' && 'windows-latest' || matrix.platform == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        shell: bash
        run: cargo build --release

      # 优先使用 dytes 官方 composite Action（自带对应平台二进制）。
      # 凭据不通过 env 传递：dytes 在用户配置缺失时回退到编译期内置凭据。
      - name: Publish with dytes (action)
        id: dytes
        continue-on-error: true
        uses: dytescn/dytes@v0.2.1
        with:
          command: publish
          version: ${{ env.DYTES_VERSION }}

      # 官方 Action 只在 GitHub 下载、无 CDN 兜底；失败时用带重试 + CDN 回退的脚本重跑
      - name: Publish with dytes (fallback)
        if: steps.dytes.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          # CDN 文件名取自 dytes 0.2.x 的 platform-exports（.bin / .app）
          case "${{ runner.os }}" in
            Windows) asset="dytes-windows.exe"; bin="dytes.exe"; platform="windows/dytes.exe" ;;
            Linux)   asset="dytes-linux";       bin="dytes";       platform="linux/dytes.bin" ;;
            macOS)   asset="dytes-macos";       bin="dytes";       platform="macos/dytes.app" ;;
            *) echo "unsupported runner: ${{ runner.os }}" >&2; exit 1 ;;
          esac
          bin_dir="${RUNNER_TEMP}/dytes-bin"
          mkdir -p "${bin_dir}"
          github_url="https://github.com/dytescn/dytes/releases/download/v${DYTES_VERSION}/${asset}"
          cdn_url="https://packages.funxdata.com/core/dytes/${DYTES_VERSION}/${platform}"
          downloaded=0
          for i in $(seq 1 12); do
            if curl -fsSL --retry 2 --retry-all-errors --retry-delay 5 "${github_url}" -o "${bin_dir}/${bin}"; then
              downloaded=1
              break
            fi
            echo "GitHub 下载失败（第 ${i} 次），重试..."
            sleep 8
          done
          if [ "${downloaded}" -eq 0 ]; then
            echo "GitHub 下载失败，改用 packages CDN"
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 "${cdn_url}" -o "${bin_dir}/${bin}"
          fi
          chmod +x "${bin_dir}/${bin}" 2>/dev/null || true
          "${bin_dir}/${bin}" --version
          "${bin_dir}/${bin}" publish
